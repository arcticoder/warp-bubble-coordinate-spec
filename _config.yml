# Jekyll configuration for warp-bubble-coordinate-spec
title: "Warp Bubble Coordinate Specification"
description: "Specification of coordinate system and symmetry assumptions for the warp-bubble metric ansatz"
author: "Arcticoder"
url: "https://arcticoder.github.io"
baseurl: "/warp-bubble-coordinate-spec"

# Build settings
markdown: kramdown
highlighter: rouge

# Kramdown settings for better math support
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

# Plugin settings
plugins:
  - jekyll-feed
  - jekyll-sitemap

# GitHub Pages safe settings
safe: true
incremental: false

# Exclude files from processing
exclude:
  - vendor/
  - .vendor/
  - node_modules/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - coordinate_spec.tex
  - coordinate_spec.log
  - coordinate_spec.aux
  - coordinate_spec.out
  - coordinate_spec.pdf
  - scripts/
  - requirements.txt
  - README.md
  - .git/
  - .gitignore
